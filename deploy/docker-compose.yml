# Production stack for the journal website.
#
#   cp .env.example .env && ./scripts/generate-secrets.sh   # then edit .env
#   ./scripts/init-ssl.sh                                   # first certificate
#   docker compose up -d --build
#   ./scripts/install-ojs.sh                                # first-time OJS install
#
# See docs/deployment-vps.md.
name: journal

x-ojs: &ojs
  build:
    context: ..
    dockerfile: deploy/ojs/Dockerfile
    args:
      OJS_VERSION: ${OJS_VERSION:-3_5_0-5}
  image: journal-ojs:${OJS_VERSION:-3_5_0-5}
  env_file: .env
  environment:
    SERVERNAME: ${JOURNAL_DOMAIN}
    OJS_DB_HOST: db
    OJS_FORCE_SSL: "On"
    OJS_TRUST_X_FORWARDED_FOR: "On"
    OJS_WEB_JOB_RUNNER: "Off"
    OJS_WEB_TASK_RUNNER: "Off"
  volumes:
    - ojs-files:/var/www/files
    - ojs-public:/var/www/html/public
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${OJS_DB_NAME:-ojs}
      MARIADB_USER: ${OJS_DB_USER:-ojs}
      MARIADB_PASSWORD: ${OJS_DB_PASSWORD:?set OJS_DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-512M}
      - --max-allowed-packet=64M
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  # OJS web application (Apache + PHP). Not published directly; nginx proxies to it.
  ojs:
    <<: *ojs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${JOURNAL_DOMAIN}", "-H", "X-Forwarded-Proto: https", "http://localhost/index.php/index/index"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Background job queue (emails, DOI deposits, search indexing, ...).
  # Exits every hour to release memory; Docker restarts it.
  worker:
    <<: *ojs
    command: ["php", "lib/pkp/tools/jobs.php", "work", "--max-time=3600", "--sleep=5", "--tries=3"]

  # Scheduled tasks (review reminders, statistics, deposits, ...), every minute.
  scheduler:
    <<: *ojs
    command: ["php", "lib/pkp/tools/scheduler.php", "work"]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - ojs
    ports:
      - "80:80"
      - "443:443"
    environment:
      JOURNAL_DOMAIN: ${JOURNAL_DOMAIN}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # Reload periodically so renewed certificates are picked up.
    command: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf; while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging

volumes:
  db-data:
  ojs-files:
  ojs-public:
  certbot-etc:
  certbot-www:
